# Builds the custom k6 load-generator image and pushes it to GHCR whenever
# the load-generator source changes on the locust-to-k6 branch.
name: Build load-generator image

on:
  push:
    branches: [locust-to-k6]
    paths:
      - src/load-generator/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push load-generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/load-generator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/opentelemetry-demo:load-generator
          cache-from: type=gha
          cache-to: type=gha,mode=max
